apiVersion: apps/v1
kind: Deployment

metadata:
  name: sql-deps
  namespace: sql-ns
  labels:
    app: sql

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sql

  template:
    metadata:
      labels:
        app: sql

    spec:
      containers:
        - name: sql
          image: mysql:latest

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-config-map
                  key: database

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc

